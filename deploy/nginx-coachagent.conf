server {
    listen 443 ssl;
    server_name coachagent.datacool.fun;

    ssl_certificate     /etc/letsencrypt/live/coachagent.datacool.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coachagent.datacool.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ✅ 上传大小（只保留一处，避免冲突）
    client_max_body_size 500m;
    client_body_timeout 300s;

    # ===== 前端（Vite preview / Streamlit / 任意前端 8501）=====
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HMR / Streamlit
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }

    # ===== 后端 API（8000）=====
    # 请求 /api/... -> 转发到 http://127.0.0.1:8000/api/...
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ===== WebSocket（8000）=====
    # 请求 /ws/... -> 转发到 http://127.0.0.1:8000/ws/...
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ===== 关键帧图片（8000）=====
    # 请求 /frames/... -> 转发到 http://127.0.0.1:8000/frames/...
    location ^~ /frames/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 缓存：不加 immutable，避免内容更新但浏览器死缓存
        expires 10m;
        add_header Cache-Control "public";
    }
}
